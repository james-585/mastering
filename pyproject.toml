[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[project]
name = "suno-mastering"
version = "0.1.0"
description = "Stem-aware mastering workflow for Suno-generated audio"
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "numpy",
    "scipy",
    "soundfile",
    "soxr",
    "pyloudnorm",
    "mutagen",
    "python-dotenv",
    "demucs",
    "torch",
]

[project.optional-dependencies]
test = ["pytest", "pytest-xdist"]

[project.scripts]
suno-mastering = "suno_mastering.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
suno_mastering = ["reference/*.json"]

[tool.pytest.ini_options]
markers = [
    "slow: longer-running tests that exercise real Demucs/Torch inference; run as a dedicated NFR acceptance gate, not part of routine fast iteration.",
    "ground_truth: tests asserting exact values against analytically-derived correct answers for synthetic signals.",
    "isolated: tests that must not share process state with others in the same run (e.g. model caches, global config). See docs/design-history/STORY-002/defects.md DEF-110.",
]
